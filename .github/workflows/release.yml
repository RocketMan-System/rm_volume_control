name: Build & Release

# Every push is tested.
# main: when the version in Cargo.toml has no release yet, binaries for all platforms
#   are built and published as release v<version>.
# beta: every push is published as pre-release v<version>-beta.<run number>, unless
#   v<version> is already released (bump the version in Cargo.toml first).
on:
  push:
    branches: [main, beta, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      base: ${{ steps.v.outputs.base }}
      release: ${{ steps.v.outputs.release }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          released() { gh release view "v$1" --repo "${{ github.repository }}" >/dev/null 2>&1; }
          version=$base
          prerelease=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            release=false
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            if released "$base"; then
              echo "Release v$base already exists, nothing to publish"
              release=false
            else
              echo "Release v$base not found, it will be built"
              release=true
            fi
          elif [ "${{ github.ref }}" = "refs/heads/beta" ]; then
            if released "$base"; then
              echo "::warning::v$base is already released: bump the version in Cargo.toml to publish a beta"
              release=false
            else
              version="$base-beta.${{ github.run_number }}"
              echo "Pre-release v$version will be built"
              release=true
              prerelease=true
            fi
          else
            release=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpulse-dev libfontconfig1-dev libxcb1-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  build:
    needs: [version, test]
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    env:
      # Full version (with the beta suffix) baked into the binary for the updater.
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpulse-dev libfontconfig1-dev libxcb1-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release --locked
          mkdir dist
          cp target/release/apps-volume-control.exe dist/apps-volume-control-windows-x86_64.exe

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked
          mkdir dist
          cp target/release/apps-volume-control dist/apps-volume-control-linux-x86_64
          cp packaging/linux/apps-volume-control.desktop dist/
          cp assets/icon256.png dist/apps-volume-control.png
          cp scripts/install-linux.sh dist/

      - name: AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          # The runner has no FUSE: let appimagetool unpack itself instead of mounting.
          APPIMAGE_EXTRACT_AND_RUN: 1
          ARCH: x86_64
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          mkdir -p AppDir/usr/bin
          cp target/release/apps-volume-control AppDir/usr/bin/
          cp packaging/linux/apps-volume-control.desktop AppDir/
          cp assets/icon256.png AppDir/apps-volume-control.png
          ln -s usr/bin/apps-volume-control AppDir/AppRun
          ./appimagetool AppDir dist/apps-volume-control-linux-x86_64.AppImage

      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: '14.2'
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          APP="dist/Apps Volume Control.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/apps-volume-control" \
            target/aarch64-apple-darwin/release/apps-volume-control \
            target/x86_64-apple-darwin/release/apps-volume-control
          sed "s/__VERSION__/${{ needs.version.outputs.base }}/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          cp assets/icon.icns "$APP/Contents/Resources/icon.icns"
          # No Developer ID: ad-hoc signature so Apple Silicon accepts the universal binary.
          codesign --force --deep --sign - "$APP"
          (cd dist && ditto -c -k --keepParent "Apps Volume Control.app" apps-volume-control-macos-universal.zip)
          rm -rf "$APP"
          cp scripts/install-macos.sh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.version.outputs.version }}"
          extra=()
          if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then
            extra=(--prerelease --latest=false)
          fi
          gh release create "$tag" dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Apps Volume Control $tag" \
            --notes-file .github/release-notes.md \
            --generate-notes \
            "${extra[@]}"
